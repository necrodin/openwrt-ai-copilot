[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openwrt-ai-rag"
version = "1.0.0"
description = "OpenWrt AI Copilot — provider-independent retrieval core + RAG integration (retrieval, context, prompt, memory, tokens, cache, rerank, grounded chat)"
requires-python = ">=3.12"
dependencies = [
    "openwrt-ai-vectorstore>=1.0.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
ai = ["openwrt-ai-core>=1.0.0", "openwrt-ai-providers>=1.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
