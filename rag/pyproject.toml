[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openwrt-ai-rag"
version = "0.1.0"
description = "OpenWrt AI Copilot — retrieval-augmented generation pipeline"
requires-python = ">=3.12"
dependencies = [
    "openwrt-ai-core>=0.1.0",
    "openwrt-ai-database>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
