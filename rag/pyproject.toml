[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openwrt-ai-rag"
version = "0.5.0a1"
description = "OpenWrt AI Copilot — provider-independent retrieval core (retrieval, context, prompt, memory, tokens, cache)"
requires-python = ">=3.12"
dependencies = [
    "openwrt-ai-vectorstore>=0.1.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
