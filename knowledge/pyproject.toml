[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openwrt-ai-knowledge"
version = "1.0.0"
description = "OpenWrt AI Copilot — provider-independent knowledge platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge"]
