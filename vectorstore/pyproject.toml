[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openwrt-ai-vectorstore"
version = "0.1.0"
description = "OpenWrt AI Copilot — provider-independent vector database layer"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8", "numpy>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["src/vectorstore"]
