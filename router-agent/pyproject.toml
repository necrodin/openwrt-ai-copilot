[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openwrt-ai-router-agent"
version = "0.1.0"
description = "OpenWrt AI Copilot — on-device router agent (data collection only)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "paramiko>=3.5",
    "httpx>=0.27,<1",
]

[project.scripts]
router-agent = "router_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/router_agent"]
