[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "ai/src", "providers/src", "rag/src", "vision/src", "database/src", "vectorstore/src", "router-agent/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ai", "providers", "rag", "vision", "database", "vectorstore", "router_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "backend"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
