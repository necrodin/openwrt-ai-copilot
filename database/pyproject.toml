[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openwrt-ai-database"
version = "1.0.0"
description = "OpenWrt AI Copilot — SQLite schema, engine, session"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
]

[tool.hatch.build.targets.wheel]
packages = ["src/database"]
