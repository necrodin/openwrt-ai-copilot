[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openwrt-ai-core"
version = "0.1.0"
description = "OpenWrt AI Copilot — provider-agnostic AI core (protocols, models, registry)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai"]
