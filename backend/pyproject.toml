[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openwrt-ai-backend"
version = "0.1.0"
description = "OpenWrt AI Copilot — FastAPI control plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.1.0",
    "certifi>=2023.0.0",
    "openwrt-ai-database>=0.1.0",
    "openwrt-ai-core>=0.1.0",
    "openwrt-ai-providers>=0.1.0",
    "openwrt-ai-rag>=0.5.0a1",
    "openwrt-ai-router-agent>=0.1.0",
    "openwrt-ai-vectorstore>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
